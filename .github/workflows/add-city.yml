name: Add cities

# Add one or many supported cities: Actions -> "Add cities" -> Run workflow.
# Paste cities (one per line or semicolon-separated). Each is geocoded, coverage
# + size checked, built, and uploaded to R2 — thin/failed ones are skipped, the
# rest go live. Only the small registry (cities.json) is committed.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Cities — one per line or semicolon-separated (e.g. "New York, NY; Houston, TX")'
        required: true
        type: string
      radius_km:
        description: "auto-box half-width in km, applied to all"
        required: false
        default: "8"
        type: string
      force:
        description: "bypass coverage/size guardrails (vetted metros only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# serialize registry-mutating runs so cities.json never collides
concurrency:
  group: city-registry
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Add cities
        env:
          CITIES: ${{ inputs.cities }}
          RADIUS: ${{ inputs.radius_km }}
          FORCE: ${{ inputs.force }}
        run: |
          added="" ; skipped=""
          # split the input on both newlines and semicolons
          # `|| [ -n "$raw" ]` so the last city (no trailing newline) still runs
          while IFS= read -r raw || [ -n "$raw" ]; do
            city="$(printf '%s' "$raw" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$city" ] && continue
            args=(--name "$city" --radius-km "$RADIUS")
            [ "$FORCE" = "true" ] && args+=(--force)
            echo "::group::$city"
            # </dev/null so a subprocess (duckdb/overpass) can't drain the
            # loop's stdin and end it early after the first city.
            if python scripts/add_city.py "${args[@]}" </dev/null; then
              added="$added"$'\n'"  ✅ $city"
            else
              skipped="$skipped"$'\n'"  ⏭️ $city"
            fi
            echo "::endgroup::"
          done < <(printf '%s' "$CITIES" | tr ';' '\n')
          {
            echo "### Add cities"
            echo "**Added:**${added:-  (none)}"
            echo ""
            echo "**Skipped (thin coverage / error / already exists):**${skipped:-  (none)}"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Added:%s\nSkipped:%s\n' "$added" "$skipped"

      - name: Upload data to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/upload_r2.py

      - name: Commit registry
        run: |
          git config user.name "unwatched-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/cities.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Add cities"
            # rebase onto latest main + retry — main can advance under us and a
            # bare push would be rejected (that's how a built city got orphaned).
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "registry pushed"; exit 0
              fi
              echo "push attempt $i failed; retrying…"; sleep $((RANDOM % 5 + 3))
            done
            echo "::error::could not push registry after retries"; exit 1
          fi
