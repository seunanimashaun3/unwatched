name: Refresh cities

# Re-pull the latest DeFlock/OSM (+ Overture) data for cities using their stored
# boxes, so removed/added cameras show up. Run on demand (Actions -> "Refresh
# cities") for specific slugs or "all", and automatically once a week.
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slugs to refresh (space/comma/newline separated), or "all"'
        required: true
        default: "all"
        type: string
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC — keep the map current

permissions:
  contents: write

# share the registry lock with add-city so cities.json never collides
concurrency:
  group: city-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Refresh
        env:
          SLUGS: ${{ inputs.slugs || 'all' }}
        run: |
          if [ "$SLUGS" = "all" ]; then
            SLUGS=$(python -c "import json;print(' '.join(json.load(open('scripts/cities.json'))))")
          fi
          refreshed="" ; failed=""
          for slug in $(printf '%s' "$SLUGS" | tr ',\n' '  '); do
            [ -z "$slug" ] && continue
            echo "::group::$slug"
            # </dev/null so a subprocess can't drain the loop's stdin
            if python scripts/refresh_city.py "$slug" </dev/null; then
              refreshed="$refreshed $slug"
            else
              failed="$failed $slug"
            fi
            echo "::endgroup::"
          done
          {
            echo "### Refresh cities"
            echo "**Refreshed:**${refreshed:-  (none)}"
            echo ""
            echo "**Failed (transient — safe to re-run):**${failed:-  (none)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/upload_r2.py

      - name: Commit registry
        run: |
          git config user.name "unwatched-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/cities.json
          if git diff --cached --quiet; then
            echo "No count changes to commit."
          else
            git commit -m "Refresh city data"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "registry pushed"; exit 0
              fi
              echo "push attempt $i failed; retrying…"; sleep $((RANDOM % 5 + 3))
            done
            echo "::error::could not push registry after retries"; exit 1
          fi
