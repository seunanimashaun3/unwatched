# Render Blueprint — static site for the Unwatched frontend.
# In Render: New > Blueprint, connect this repo; it builds web/ and serves the
# static bundle over HTTPS (required for geolocation / Drive mode).
services:
  - type: web
    runtime: static
    name: unwatched
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA client-side routing: serve index.html for unknown deep links
    # (e.g. /san-jose-ca). Base path stays "/" on Render's root domain.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=86400
